[project]
name = "verynth-backend"
version = "0.1.0"
description = "VERYNTH - AI-powered dependency migration platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",  # FastAPI Depends in function defaults
    "BLE001", # Exception catching in subprocess cleanup
    "S110",  # Try/except pass in cleanup
]
